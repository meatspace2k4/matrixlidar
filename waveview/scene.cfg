# waveview scene definition. One line per element: key, then numbers/strings.
# Coordinate system is CHARACTER CELLS of the terminal being reproduced:
# x = columns rightward, y = rows downward, z = depth INTO the screen (a
# lidar return of D mm extrudes its cell D*depth px backward). The whole
# interface is one rigid assembly in this space; rotation is applied to the
# assembly, never to the camera, and the camera is a fixed orthographic
# projection at identity. Not XML, not CSS: split each line on spaces.

ch      9 19          # px per char cell, w h
canvas  50 22         # interface size in chars, w h
depth   0.10          # z px per mm of measured distance
fov     45            # sensor full field of view, degrees (both axes)
trail   36            # near-field lift points kept in the wave trail

grid    0 2 6         # col row cell-width-in-chars (heatmap_client: cells joined from col 0, row 2)
